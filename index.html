<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Receipt - 간편 영수증 가계부</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(135deg, #1E3A5F 0%, #1A73E8 55%, #0D47A1 100%);
    color: #fff;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    text-align: center;
    padding: 40px;
  }
  h1 {
    font-size: 28px;
    margin-bottom: 8px;
  }
  p {
    color: #E3ECFF;
    font-size: 16px;
  }
  a {
    color: #fff;
    text-decoration: underline;
  }

<body>
  <div class="card">
    <h1>Simple Receipt (간편 영수증 가계부)</h1>
    <p>영수증을 사진으로 찍으면 자동으로 인식해서 가계부에 기록해주는 앱입니다.</p>
    <p><a href="https://play.google.com/store/apps/details?id=com.simple.receiptnote">Google Play에서 보기</a></p>

</html>
